<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">TENFOLD public development milestones</title><desc id="desc">Technical score across selected milestones: baseline 0.106710, selective state 0.777657, retrieval v2 0.892843, confidence controller 0.899843, frozen repair 0.902435. All are on the same 200 public development sessions.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#287B61" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1600" height="1040" rx="28" fill="#F8F6F0"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#287B61"/><text x="64" y="64" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="4" fill="#18332D">TENFOLD</text><text x="1536" y="64" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="end" letter-spacing="1" fill="#52635B">PUBLIC DEVELOPMENT RESULTS</text><text x="64" y="154" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">Measured progress. Not a leaderboard claim.</text><text x="66" y="209.0" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Selected engineering milestones, evaluated on the same 200 public sessions. Technical score: higher is better.</text><path d="M495 302 L495 857" stroke="#D8DFD5" stroke-width="2" fill="none"/><text x="495" y="289" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#52635B">0.0</text><path d="M659.8 302 L659.8 857" stroke="#D8DFD5" stroke-width="2" fill="none"/><text x="659.8" y="289" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#52635B">0.2</text><path d="M824.6 302 L824.6 857" stroke="#D8DFD5" stroke-width="2" fill="none"/><text x="824.6" y="289" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#52635B">0.4</text><path d="M989.4 302 L989.4 857" stroke="#D8DFD5" stroke-width="2" fill="none"/><text x="989.4" y="289" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#52635B">0.6</text><path d="M1154.2 302 L1154.2 857" stroke="#D8DFD5" stroke-width="2" fill="none"/><text x="1154.2" y="289" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#52635B">0.8</text><path d="M1319 302 L1319 857" stroke="#D8DFD5" stroke-width="2" fill="none"/><text x="1319" y="289" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#52635B">1.0</text><text x="66" y="344" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">Kit baseline</text><text x="66" y="380" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Weak BM25, no state</text><rect x="495" y="321" width="87.92904" height="64" rx="9" fill="#A95B24"/><text x="1528" y="365" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="end" letter-spacing="0" fill="#18332D">0.106710</text><text x="66" y="453" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">Phase A</text><text x="66" y="489" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Selective state + v1 retrieval</text><rect x="495" y="430" width="640.7893680000001" height="64" rx="9" fill="#D8DFD5"/><text x="1528" y="474" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="end" letter-spacing="0" fill="#18332D">0.777657</text><text x="66" y="562" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">Phase B</text><text x="66" y="598" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Field-aware retrieval v2</text><rect x="495" y="539" width="735.702632" height="64" rx="9" fill="#D8DFD5"/><text x="1528" y="583" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="end" letter-spacing="0" fill="#18332D">0.892843</text><text x="66" y="671" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">Phase C</text><text x="66" y="707" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Confidence controller</text><rect x="495" y="648" width="741.4706319999999" height="64" rx="9" fill="#D8DFD5"/><text x="1528" y="692" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="end" letter-spacing="0" fill="#18332D">0.899843</text><text x="66" y="780" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">Phase E / frozen</text><text x="66" y="816" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Robust parser + IDF coverage</text><rect x="495" y="757" width="743.60644" height="64" rx="9" fill="#287B61"/><text x="1528" y="801" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="end" letter-spacing="0" fill="#287B61">0.902435</text><text x="64" y="915" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Technical score = 0.50 × HitRate@10 + 0.30 × MRR + 0.20 × turn efficiency</text><path d="M64 946 L1536 946" stroke="#D8DFD5" stroke-width="2" fill="none"/><text x="64" y="988.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Historical development milestones, not independent test sets or isolated causal contributions. Phase D was a robustness audit.</text></svg>