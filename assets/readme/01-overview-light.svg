<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc"><title id="title">TENFOLD: change your mind, keep your progress</title><desc id="desc">A deterministic conversational shopping engine. Public evaluation: 97.5 percent HitRate at 10, 0.902435 technical score, 2.94 mean turns, on 200 sessions.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#287B61" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1600" height="850" rx="28" fill="#F8F6F0"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#287B61"/><text x="64" y="64" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="4" fill="#18332D">TENFOLD</text><text x="1536" y="64" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="end" letter-spacing="1" fill="#52635B">CONVERSATIONAL PRODUCT SEARCH</text><text x="64" y="194" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">Change your mind.</text><text x="64" y="289" font-family="Georgia, serif" font-size="79" font-weight="400" text-anchor="start" letter-spacing="0" fill="#287B61">Keep your progress.</text><text x="69" y="365.0" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">A shopping agent that updates what changed and</text><text x="69" y="411.92" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">preserves the evidence that still matters.</text><rect x="1100" y="160" width="190" height="67" rx="12" fill="#E3EDE2"/><text x="1119" y="203" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0" fill="#287B61">CATEGORY</text><rect x="1316" y="160" width="190" height="67" rx="12" fill="#E3EDE2"/><text x="1335" y="203" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0" fill="#287B61">BUDGET</text><rect x="1100" y="249" width="190" height="67" rx="12" fill="#F3E4D1"/><text x="1119" y="292" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0" fill="#A95B24">UPDATE</text><rect x="1316" y="249" width="190" height="67" rx="12" fill="#E3EDE2"/><text x="1335" y="292" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0" fill="#287B61">FEATURE</text><rect x="1100" y="338" width="190" height="67" rx="12" fill="#E3EDE2"/><text x="1119" y="381" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0" fill="#287B61">MATERIAL</text><rect x="1316" y="338" width="190" height="67" rx="12" fill="#E3EDE2"/><text x="1335" y="381" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0" fill="#287B61">STYLE</text><text x="1100" y="465" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">TYPED EVIDENCE, NOT A TRANSCRIPT</text><path d="M64 509 L1536 509" stroke="#D8DFD5" stroke-width="2" fill="none"/><text x="66" y="616" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="700" text-anchor="start" letter-spacing="0" fill="#287B61">97.5%</text><text x="66" y="665" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">HitRate@10</text><text x="66" y="704" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">195 of 200 public sessions</text><path d="M421 554 L421 708" stroke="#D8DFD5" stroke-width="2" fill="none"/><text x="448" y="616" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">0.9024</text><text x="448" y="665" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">Technical score</text><text x="448" y="704" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Composite metric, scale 0–1</text><path d="M803 554 L803 708" stroke="#D8DFD5" stroke-width="2" fill="none"/><text x="830" y="616" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">2.94</text><text x="830" y="665" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">Mean turns to hit</text><text x="830" y="704" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Misses count as turn 11</text><path d="M1185 554 L1185 708" stroke="#D8DFD5" stroke-width="2" fill="none"/><text x="1212" y="616" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">50,000</text><text x="1212" y="665" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">Catalog products</text><text x="1212" y="704" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Frozen organizer catalog</text><path d="M64 756 L1536 756" stroke="#D8DFD5" stroke-width="2" fill="none"/><text x="64" y="798.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Public development-set results • Python + SQLite FTS5 • No runtime model calls • Private-set performance unknown</text></svg>