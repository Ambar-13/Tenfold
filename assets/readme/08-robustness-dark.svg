<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc"><title id="title">Robustness before and after the Phase E repair</title><desc id="desc">Dumbbell chart on a zero-to-one technical score scale. H1 improves 0.449313 to 0.724281, H2 0.403764 to 0.694369, H3 0.306111 to 0.581891. Independent-renderer holdout is 0.672183. These reuse public targets, not private evaluation.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#8BD8AB" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1600" height="1060" rx="28" fill="#102520"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#8BD8AB"/><text x="64" y="64" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="4" fill="#ECF3E7">TENFOLD</text><text x="1536" y="64" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="end" letter-spacing="1" fill="#B0C2B6">STRESS TESTS / PUBLIC TARGETS</text><text x="64" y="154" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">The repair travels beyond one phrasing.</text><text x="66" y="209.0" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Hardened simulator families reuse public targets. They test dialogue rendering, not private-target generalization.</text><path d="M585 361 L585 841" stroke="#355046" stroke-width="2" fill="none"/><text x="585" y="885" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#B0C2B6">0.00</text><path d="M788.75 361 L788.75 841" stroke="#355046" stroke-width="2" fill="none"/><text x="788.75" y="885" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#B0C2B6">0.25</text><path d="M992.5 361 L992.5 841" stroke="#355046" stroke-width="2" fill="none"/><text x="992.5" y="885" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#B0C2B6">0.50</text><path d="M1196.25 361 L1196.25 841" stroke="#355046" stroke-width="2" fill="none"/><text x="1196.25" y="885" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#B0C2B6">0.75</text><path d="M1400 361 L1400 841" stroke="#355046" stroke-width="2" fill="none"/><text x="1400" y="885" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#B0C2B6">1.00</text><circle cx="80" cy="291" r="7" fill="#102520" stroke="#B0C2B6" stroke-width="3"/><text x="99" y="301" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Pre-fix</text><circle cx="253" cy="291" r="7" fill="#8BD8AB" stroke="#8BD8AB" stroke-width="3"/><text x="272" y="301" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">Phase E / frozen</text><text x="64" y="405" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">H1 / paraphrase</text><text x="64" y="444" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Same information, changed wording</text><path d="M951.190095 410 L1175.2890149999998 410" stroke="#8BD8AB" stroke-width="6" fill="none"/><circle cx="951.190095" cy="410" r="9" fill="#102520" stroke="#B0C2B6" stroke-width="3"/><text x="951.190095" y="453" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#B0C2B6">0.449</text><circle cx="1175.2890149999998" cy="410" r="10" fill="#8BD8AB" stroke="#8BD8AB" stroke-width="3"/><text x="1175.2890149999998" y="386" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle" letter-spacing="0" fill="#8BD8AB">0.724</text><text x="64" y="533" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">H2 / restriction + reorder</text><text x="64" y="572" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Adds broad-question restriction</text><path d="M914.0676599999999 538 L1150.910735 538" stroke="#8BD8AB" stroke-width="6" fill="none"/><circle cx="914.0676599999999" cy="538" r="9" fill="#102520" stroke="#B0C2B6" stroke-width="3"/><text x="914.0676599999999" y="581" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#B0C2B6">0.404</text><circle cx="1150.910735" cy="538" r="10" fill="#8BD8AB" stroke="#8BD8AB" stroke-width="3"/><text x="1150.910735" y="514" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle" letter-spacing="0" fill="#8BD8AB">0.694</text><text x="64" y="661" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">H3 / drop + noise</text><text x="64" y="700" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Also removes information</text><path d="M834.480465 666 L1059.241165 666" stroke="#8BD8AB" stroke-width="6" fill="none"/><circle cx="834.480465" cy="666" r="9" fill="#102520" stroke="#B0C2B6" stroke-width="3"/><text x="834.480465" y="709" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#B0C2B6">0.306</text><circle cx="1059.241165" cy="666" r="10" fill="#8BD8AB" stroke="#8BD8AB" stroke-width="3"/><text x="1059.241165" y="642" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle" letter-spacing="0" fill="#8BD8AB">0.582</text><text x="64" y="789" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Verifier-authored holdout</text><text x="64" y="828" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Independent paraphrase renderer</text><circle cx="1132.829145" cy="794" r="10" fill="#8BD8AB" stroke="#8BD8AB" stroke-width="3"/><text x="1132.829145" y="770" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle" letter-spacing="0" fill="#8BD8AB">0.672</text><text x="64" y="936" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Official public technical score: 0.902435. Stress-test scores remain materially lower.</text><path d="M64 966 L1536 966" stroke="#355046" stroke-width="2" fill="none"/><text x="64" y="1008.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">All numbers from stored raw results • Holdout marker shows the frozen score only • No uncertainty intervals or private scores implied</text></svg>