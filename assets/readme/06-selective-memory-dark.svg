<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc"><title id="title">Actual selective invalidation in public_0003</title><desc id="desc">After the user says to ignore an earlier preference, Stainless Steel Band is deleted while Water Resistant and 3 Year Battery remain active. The target was already rank one before the override; this demonstrates state handling, not rank rescue.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#8BD8AB" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1600" height="1020" rx="28" fill="#102520"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#8BD8AB"/><text x="64" y="64" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="4" fill="#ECF3E7">TENFOLD</text><text x="1536" y="64" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="end" letter-spacing="1" fill="#B0C2B6">AN ACTUAL RECORDED SESSION</text><text x="64" y="154" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Forget the preference. Not the progress.</text><text x="66" y="209.0" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">public_0003 • An observed state transition from the shipping agent, not a hypothetical example.</text><rect x="64" y="283" width="1472" height="112" rx="18" fill="#443B27"/><text x="96" y="329.0" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="400" text-anchor="start" letter-spacing="0" fill="#F4B575">“Actually, ignore my earlier preference. What I need is: Water Resistant.”</text><text x="66" y="461" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0" fill="#B0C2B6">BEFORE / AFTER TURN 2</text><text x="866" y="461" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">AFTER / AFTER TURN 3</text><rect x="64" y="491" width="670" height="69" rx="18" fill="#19392F"/><text x="88" y="536" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Category: Watches Wrist Watches</text><rect x="64" y="591" width="670" height="75" rx="18" fill="#214938"/><text x="89" y="637" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Stainless Steel Band</text><text x="709" y="637" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end" letter-spacing="0" fill="#8BD8AB">ACTIVE</text><rect x="64" y="686" width="670" height="75" rx="18" fill="#214938"/><text x="89" y="732" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Water Resistant</text><text x="709" y="732" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end" letter-spacing="0" fill="#8BD8AB">ACTIVE</text><rect x="64" y="781" width="670" height="75" rx="18" fill="#214938"/><text x="89" y="827" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" letter-spacing="0" fill="#ECF3E7">3 Year Battery</text><text x="709" y="827" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end" letter-spacing="0" fill="#8BD8AB">ACTIVE</text><rect x="864" y="491" width="670" height="69" rx="18" fill="#19392F"/><text x="888" y="536" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Category: Watches Wrist Watches</text><rect x="864" y="591" width="670" height="75" rx="18" fill="#4A302A"/><text x="889" y="637" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" letter-spacing="0" fill="#F0A496">Stainless Steel Band</text><text x="1509" y="637" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end" letter-spacing="0" fill="#F0A496">DELETED</text><path d="M888 626 L1167.0 626" stroke="#F0A496" stroke-width="2" fill="none"/><rect x="864" y="686" width="670" height="75" rx="18" fill="#214938"/><text x="889" y="732" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Water Resistant</text><text x="1509" y="732" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end" letter-spacing="0" fill="#8BD8AB">ACTIVE</text><rect x="864" y="781" width="670" height="75" rx="18" fill="#214938"/><text x="889" y="827" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" letter-spacing="0" fill="#ECF3E7">3 Year Battery</text><text x="1509" y="827" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end" letter-spacing="0" fill="#8BD8AB">ACTIVE</text><path d="M757 662 L838 662" stroke="#8BD8AB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="66" y="912" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Same category. Compatible disclosures retained. The abandoned opener preference is explicitly retired.</text><path d="M64 926 L1536 926" stroke="#355046" stroke-width="2" fill="none"/><text x="64" y="968.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">The target was already rank 1 on turn 2; scoring first becomes valid after the override on turn 3. This is not a rank-rescue claim.</text></svg>