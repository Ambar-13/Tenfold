<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">TENFOLD project mind map</title><desc id="desc">Six branches: task, state, retrieval, policy, evidence and boundaries. Runtime search uses no model calls; private-set performance and general language robustness remain unknown.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#287B61" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1600" height="1120" rx="28" fill="#F8F6F0"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#287B61"/><text x="64" y="64" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="4" fill="#18332D">TENFOLD</text><text x="1536" y="64" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="end" letter-spacing="1" fill="#52635B">PROJECT MAP</text><text x="64" y="154" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">The whole system, at a glance.</text><text x="66" y="209.0" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">A map of the problem, the engine, the evidence, and the claims we deliberately do not make.</text><path d="M648 650 C599.0 650 599.0 382 550 382" stroke="#D8DFD5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M648 650 C599.0 650 599.0 628 550 628" stroke="#D8DFD5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M648 650 C599.0 650 599.0 874 550 874" stroke="#D8DFD5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M952 650 C1001.0 650 1001.0 382 1050 382" stroke="#D8DFD5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M952 650 C1001.0 650 1001.0 628 1050 628" stroke="#D8DFD5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M952 650 C1001.0 650 1001.0 874 1050 874" stroke="#D8DFD5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="646" y="571" width="308" height="156" rx="18" fill="#287B61"/><text x="800" y="640" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle" letter-spacing="0" fill="#F8F6F0">TENFOLD</text><text x="800" y="683" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle" letter-spacing="1" fill="#F8F6F0">STATEFUL SEARCH</text><rect x="64" y="292" width="486" height="183" rx="18" fill="#EFEFE6"/><rect x="64" y="292" width="6" height="183" rx="3" fill="#287B61"/><text x="92" y="335" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="1" fill="#287B61">THE TASK</text><text x="92" y="380" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">One hidden product in 50,000</text><text x="92" y="414" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">Up to 10 turns, top-10 IDs</text><text x="92" y="448" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">Exact parent_asin matching</text><rect x="64" y="538" width="486" height="183" rx="18" fill="#EFEFE6"/><rect x="64" y="538" width="6" height="183" rx="3" fill="#287B61"/><text x="92" y="581" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="1" fill="#287B61">MEMORY</text><text x="92" y="626" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">Typed constraints + provenance</text><text x="92" y="660" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">KEEP · SET · DELETE · UNKNOWN</text><text x="92" y="694" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">Selective invalidation</text><rect x="64" y="784" width="486" height="183" rx="18" fill="#EFEFE6"/><rect x="64" y="784" width="6" height="183" rx="3" fill="#287B61"/><text x="92" y="827" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="1" fill="#287B61">RETRIEVAL</text><text x="92" y="872" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">Category / budget / negatives</text><text x="92" y="906" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">BM25 + saturated coverage</text><text x="92" y="940" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">Ordered relaxation ladder</text><rect x="1050" y="292" width="486" height="183" rx="18" fill="#EFEFE6"/><rect x="1050" y="292" width="6" height="183" rx="3" fill="#287B61"/><text x="1078" y="335" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="1" fill="#287B61">POLICY</text><text x="1078" y="380" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">Ask “other”, then missing slots</text><text x="1078" y="414" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">Hold or release the ranked list</text><text x="1078" y="448" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">Confidence + turn-3 fallback</text><rect x="1050" y="538" width="486" height="183" rx="18" fill="#EFEFE6"/><rect x="1050" y="538" width="6" height="183" rx="3" fill="#287B61"/><text x="1078" y="581" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="1" fill="#287B61">EVIDENCE</text><text x="1078" y="626" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">200 public development sessions</text><text x="1078" y="660" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">Ablations + stress-test families</text><text x="1078" y="694" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">Byte-identical reproduction</text><rect x="1050" y="784" width="486" height="183" rx="18" fill="#EFEFE6"/><rect x="1050" y="784" width="6" height="183" rx="3" fill="#287B61"/><text x="1078" y="827" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="1" fill="#287B61">BOUNDARIES</text><text x="1078" y="872" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">No runtime model calls</text><text x="1078" y="906" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">No profile-based personalization</text><text x="1078" y="940" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">Private-set performance unknown</text><path d="M64 1026 L1536 1026" stroke="#D8DFD5" stroke-width="2" fill="none"/><text x="64" y="1068.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Use this as the overview. The architecture and algorithm diagrams expand the engine; the charts below expand the evidence.</text></svg>