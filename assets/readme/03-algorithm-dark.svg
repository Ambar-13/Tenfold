<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420" role="img" aria-labelledby="title desc"><title id="title">TENFOLD shipped per-turn algorithm</title><desc id="desc">Update typed state, choose a clarification attribute, retrieve and compute confidence, then hold or recommend. Turn three or later, card exhaustion, or a sufficiently saturated leader opens recommendations.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#8BD8AB" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1600" height="1420" rx="28" fill="#102520"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#8BD8AB"/><text x="64" y="64" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="4" fill="#ECF3E7">TENFOLD</text><text x="1536" y="64" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="end" letter-spacing="1" fill="#B0C2B6">SHIPPED CONTROL FLOW</text><text x="64" y="154" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Ask and recommend are not opposites.</text><text x="66" y="209.0" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">A turn may ask a question and return products. The controller gates the recommendation list.</text><rect x="300" y="288" width="1000" height="128" rx="18" fill="#19392F"/><text x="332" y="330" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">01 / UPDATE STATE</text><text x="332" y="371.0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Turn 1: parse opener. Later turns: check no-information replies before override</text><text x="332" y="405.5" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">detection.</text><path d="M800 422 L800 452" stroke="#8BD8AB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="300" y="463" width="1000" height="128" rx="18" fill="#19392F"/><text x="332" y="505" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">02 / CHOOSE ASK ATTRIBUTE</text><text x="332" y="546.0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Ask “other” until exhausted, then a missing specific attribute. At turn 10, ask</text><text x="332" y="580.5" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">nothing.</text><path d="M800 597 L800 627" stroke="#8BD8AB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="300" y="638" width="1000" height="128" rx="18" fill="#19392F"/><text x="332" y="680" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">03 / RETRIEVE + MEASURE</text><text x="332" y="721.0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Search active evidence. Compute saturation, coverage-score gap and retrieval</text><text x="332" y="755.5" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">level.</text><path d="M800 772 L800 802" stroke="#8BD8AB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="300" y="822" width="1000" height="160" rx="18" fill="#443B27"/><text x="332" y="869" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0" fill="#F4B575">RECOMMEND IF ANY CONDITION HOLDS</text><text x="332" y="912" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#ECF3E7">turn ≥ 3  OR  “other” exhausted  OR  early-confidence gate passes</text><text x="332" y="952" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Early gate: enough positive constraints + saturation + level 0 + gap &gt; 0</text><path d="M600 985 V1030 H412 V1070" stroke="#8BD8AB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1000 985 V1030 H1188 V1070" stroke="#8BD8AB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="430" y="1016" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">YES</text><text x="1100" y="1016" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start" letter-spacing="0" fill="#B0C2B6">NO</text><rect x="120" y="1083" width="590" height="154" rx="18" fill="#214938"/><text x="151" y="1131" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">ASK + RECOMMEND</text><text x="151" y="1178.0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Pad to top_k unique valid IDs. Return the</text><text x="151" y="1212.5" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">ordered recommendation slate.</text><rect x="890" y="1083" width="590" height="154" rx="18" fill="#19392F"/><text x="921" y="1131" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">ASK + HOLD</text><text x="921" y="1178.0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Return recommendations: []. Await the next</text><text x="921" y="1212.5" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">disclosure and update state.</text><text x="122" y="1282" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Early gate minimum: 1 active positive constraint on turn 1; 2 thereafter.</text><path d="M64 1326 L1536 1326" stroke="#355046" stroke-width="2" fill="none"/><text x="64" y="1368.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Shipped v2 + conf defaults • Ask is independently selected • An evaluator hit or turn 10 ends the session</text></svg>