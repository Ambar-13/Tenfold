<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">TENFOLD system architecture</title><desc id="desc">Five modules: typed state, selective invalidation, retrieval, confidence policy and response orchestration. The catalog feeds retrieval; the user reply updates session state.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#8BD8AB" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1600" height="1040" rx="28" fill="#102520"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#8BD8AB"/><text x="64" y="64" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="4" fill="#ECF3E7">TENFOLD</text><text x="1536" y="64" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="end" letter-spacing="1" fill="#B0C2B6">SYSTEM ARCHITECTURE</text><text x="64" y="154" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Five modules. One inspectable loop.</text><text x="66" y="209.0" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Session state is explicit. Retrieval is catalog-grounded. Every recommendation is a real product identifier.</text><rect x="64" y="286" width="1472" height="76" rx="18" fill="#214938"/><text x="96" y="336" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">INPUT</text><text x="244" y="336" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" letter-spacing="0" fill="#ECF3E7">session_id  ·  user_message  ·  turn  ·  top_k</text><rect x="64" y="430" width="275" height="287" rx="18" fill="#19392F"/><text x="87" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">01</text><text x="87" y="514" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">state.py</text><text x="87" y="566" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Typed state</text><text x="87" y="607" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Classify user message</text><text x="87" y="641" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Strip framing words</text><text x="87" y="675" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Apply typed operations</text><path d="M343 555 L358 555" stroke="#8BD8AB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="363" y="430" width="275" height="287" rx="18" fill="#19392F"/><text x="386" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">02</text><text x="386" y="514" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">override.py</text><text x="386" y="566" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Selective memory</text><text x="386" y="607" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Detect intent changes</text><text x="386" y="641" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Retire changed evidence</text><text x="386" y="675" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Keep compatible slots</text><path d="M642 555 L657 555" stroke="#8BD8AB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="662" y="430" width="275" height="287" rx="18" fill="#19392F"/><text x="685" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">03</text><text x="685" y="514" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">retrieval.py</text><text x="685" y="566" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Catalog search</text><text x="685" y="607" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Category + budget</text><text x="685" y="641" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Field-weighted BM25</text><text x="685" y="675" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Full-coverage promotion</text><path d="M941 555 L956 555" stroke="#8BD8AB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="961" y="430" width="275" height="287" rx="18" fill="#19392F"/><text x="984" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">04</text><text x="984" y="514" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">policy.py</text><text x="984" y="566" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Turn decisions</text><text x="984" y="607" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Choose question slot</text><text x="984" y="641" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Gate recommendations</text><text x="984" y="675" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Confidence + fallback</text><path d="M1240 555 L1255 555" stroke="#8BD8AB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1260" y="430" width="275" height="287" rx="18" fill="#19392F"/><text x="1283" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">05</text><text x="1283" y="514" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">agent.py</text><text x="1283" y="566" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Response contract</text><text x="1283" y="607" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Orchestrate modules</text><text x="1283" y="641" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Validate ranked IDs</text><text x="1283" y="675" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Return message + usage</text><path d="M200 366 L200 419" stroke="#8BD8AB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="65" y="790" width="567" height="105" rx="18" fill="#443B27"/><text x="90" y="833" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0" fill="#F4B575">CATALOG / 50,000 PRODUCTS</text><text x="90" y="868" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Indexed once at agent initialization</text><path d="M632 842 H800 V731" stroke="#8BD8AB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="937" y="790" width="598" height="105" rx="18" fill="#214938"/><text x="963" y="833" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">RETURN / ASK + HOLD OR ASK + RECOMMEND</text><text x="963" y="868" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#ECF3E7">[] when holding; ranked IDs when recommending</text><path d="M1400 730 V778" stroke="#8BD8AB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1536 842 H1570 V394 H45 V555 H56" stroke="#8BD8AB" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="704" y="418" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">NEXT USER REPLY → SAME SESSION</text><path d="M64 946 L1536 946" stroke="#355046" stroke-width="2" fill="none"/><text x="64" y="988.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Schematic module view, not exact call order. Agent orchestrates the modules; the algorithm chart shows the control flow.</text></svg>