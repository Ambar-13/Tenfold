<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-labelledby="title desc"><title id="title">TENFOLD retrieval and ranking algorithm</title><desc id="desc">Build a query from active positive and negative evidence. Apply category and numeric budget filters. Retrieve using SQLite FTS5 and weighted BM25. Fully saturated candidates are promoted per retrieval level; others retain BM25 order.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#8BD8AB" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1600" height="1030" rx="28" fill="#102520"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#8BD8AB"/><text x="64" y="64" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="4" fill="#ECF3E7">TENFOLD</text><text x="1536" y="64" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="end" letter-spacing="1" fill="#B0C2B6">RETRIEVAL ALGORITHM</text><text x="64" y="154" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">From evidence to a ranked slate.</text><text x="66" y="209.0" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Lexical relevance does the retrieval. Constraint coverage adds a carefully bounded promotion rule.</text><rect x="64" y="296" width="450" height="265" rx="18" fill="#19392F"/><text x="94" y="344" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">01</text><text x="94" y="397" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Build the plan</text><text x="94" y="449" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Active positive evidence</text><text x="94" y="486" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Negative constraints</text><text x="94" y="523" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Category and budget</text><path d="M524 431 L560 431" stroke="#8BD8AB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="575" y="296" width="450" height="265" rx="18" fill="#19392F"/><text x="605" y="344" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">02</text><text x="605" y="397" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Retrieve candidates</text><text x="605" y="449" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">SQLite FTS5 index</text><text x="605" y="486" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Field-weighted BM25</text><text x="605" y="523" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Title &gt; features &gt; description</text><path d="M1035 431 L1071 431" stroke="#8BD8AB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1086" y="296" width="450" height="265" rx="18" fill="#214938"/><text x="1116" y="344" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">03</text><text x="1116" y="397" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Order within each level</text><text x="1116" y="449" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Full saturation first</text><text x="1116" y="486" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Then continuous coverage</text><text x="1116" y="523" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Others keep BM25 order</text><text x="65" y="640" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start" letter-spacing="2" fill="#8BD8AB">RELAXATION LADDER</text><rect x="64" y="688" width="320" height="83" rx="18" fill="#19392F"/><text x="87" y="741" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Budget + category</text><path d="M390 729 H419 V756 H439" stroke="#8BD8AB" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="448" y="715" width="320" height="83" rx="18" fill="#19392F"/><text x="471" y="768" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Category only</text><path d="M774 756 H803 V783 H823" stroke="#8BD8AB" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="832" y="742" width="320" height="83" rx="18" fill="#19392F"/><text x="855" y="795" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Unanchored terms</text><path d="M1158 783 H1187 V810 H1207" stroke="#8BD8AB" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1216" y="769" width="320" height="83" rx="18" fill="#19392F"/><text x="1239" y="822" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">Legacy query</text><text x="65" y="880.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Unavailable budget/category steps are omitted. With coverage_band = 0, partial-coverage candidates are not reordered.</text><path d="M64 936 L1536 936" stroke="#355046" stroke-width="2" fill="none"/><text x="64" y="978.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Derived from retrieval.py • Conceptual pipeline; not a claim that each stage shrinks the pool by a measured percentage</text></svg>