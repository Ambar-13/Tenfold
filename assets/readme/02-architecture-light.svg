<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">TENFOLD system architecture</title><desc id="desc">Five modules: typed state, selective invalidation, retrieval, confidence policy and response orchestration. The catalog feeds retrieval; the user reply updates session state.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#287B61" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1600" height="1040" rx="28" fill="#F8F6F0"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#287B61"/><text x="64" y="64" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="4" fill="#18332D">TENFOLD</text><text x="1536" y="64" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="end" letter-spacing="1" fill="#52635B">SYSTEM ARCHITECTURE</text><text x="64" y="154" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">Five modules. One inspectable loop.</text><text x="66" y="209.0" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Session state is explicit. Retrieval is catalog-grounded. Every recommendation is a real product identifier.</text><rect x="64" y="286" width="1472" height="76" rx="18" fill="#E3EDE2"/><text x="96" y="336" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0" fill="#287B61">INPUT</text><text x="244" y="336" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">session_id  ·  user_message  ·  turn  ·  top_k</text><rect x="64" y="430" width="275" height="287" rx="18" fill="#EFEFE6"/><text x="87" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0" fill="#287B61">01</text><text x="87" y="514" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">state.py</text><text x="87" y="566" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">Typed state</text><text x="87" y="607" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Classify user message</text><text x="87" y="641" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Strip framing words</text><text x="87" y="675" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Apply typed operations</text><path d="M343 555 L358 555" stroke="#287B61" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="363" y="430" width="275" height="287" rx="18" fill="#EFEFE6"/><text x="386" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0" fill="#287B61">02</text><text x="386" y="514" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">override.py</text><text x="386" y="566" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">Selective memory</text><text x="386" y="607" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Detect intent changes</text><text x="386" y="641" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Retire changed evidence</text><text x="386" y="675" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Keep compatible slots</text><path d="M642 555 L657 555" stroke="#287B61" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="662" y="430" width="275" height="287" rx="18" fill="#EFEFE6"/><text x="685" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0" fill="#287B61">03</text><text x="685" y="514" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">retrieval.py</text><text x="685" y="566" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">Catalog search</text><text x="685" y="607" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Category + budget</text><text x="685" y="641" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Field-weighted BM25</text><text x="685" y="675" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Full-coverage promotion</text><path d="M941 555 L956 555" stroke="#287B61" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="961" y="430" width="275" height="287" rx="18" fill="#EFEFE6"/><text x="984" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0" fill="#287B61">04</text><text x="984" y="514" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">policy.py</text><text x="984" y="566" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">Turn decisions</text><text x="984" y="607" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Choose question slot</text><text x="984" y="641" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Gate recommendations</text><text x="984" y="675" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Confidence + fallback</text><path d="M1240 555 L1255 555" stroke="#287B61" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1260" y="430" width="275" height="287" rx="18" fill="#EFEFE6"/><text x="1283" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0" fill="#287B61">05</text><text x="1283" y="514" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">agent.py</text><text x="1283" y="566" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0" fill="#18332D">Response contract</text><text x="1283" y="607" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Orchestrate modules</text><text x="1283" y="641" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Validate ranked IDs</text><text x="1283" y="675" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Return message + usage</text><path d="M200 366 L200 419" stroke="#287B61" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="65" y="790" width="567" height="105" rx="18" fill="#F3E4D1"/><text x="90" y="833" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0" fill="#A95B24">CATALOG / 50,000 PRODUCTS</text><text x="90" y="868" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Indexed once at agent initialization</text><path d="M632 842 H800 V731" stroke="#287B61" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="937" y="790" width="598" height="105" rx="18" fill="#E3EDE2"/><text x="963" y="833" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0" fill="#287B61">RETURN / ASK + HOLD OR ASK + RECOMMEND</text><text x="963" y="868" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#18332D">[] when holding; ranked IDs when recommending</text><path d="M1400 730 V778" stroke="#287B61" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1536 842 H1570 V394 H45 V555 H56" stroke="#287B61" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="704" y="418" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">NEXT USER REPLY → SAME SESSION</text><path d="M64 946 L1536 946" stroke="#D8DFD5" stroke-width="2" fill="none"/><text x="64" y="988.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#52635B">Schematic module view, not exact call order. Agent orchestrates the modules; the algorithm chart shows the control flow.</text></svg>