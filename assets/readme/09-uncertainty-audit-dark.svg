<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-labelledby="title desc"><title id="title">Empirical uncertainty audit: contraction and coverage</title><desc id="desc">Official-family calibrated rank cutoffs contract from 319 at turn one to 30, 5, and 4 by turn four. Eval coverage is 82.35, 91.76, 94.12 and 95.29 percent. Pooled coverage 93.53 percent over 850 session-turn observations from 85 non-override sessions. This report-only audit changes no agent behavior.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#8BD8AB" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1600" height="1030" rx="28" fill="#102520"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#8BD8AB"/><text x="64" y="64" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="4" fill="#ECF3E7">TENFOLD</text><text x="1536" y="64" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="end" letter-spacing="1" fill="#B0C2B6">REPORT-ONLY EMPIRICAL AUDIT</text><text x="64" y="154" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" text-anchor="start" letter-spacing="0" fill="#ECF3E7">A smaller set. A measured coverage rate.</text><text x="66" y="209.0" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Official-family audit of 85 non-override eval sessions across ten turns. This does not change agent behavior.</text><text x="64" y="309" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">CALIBRATED RANK CUTOFF</text><text x="866" y="309" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0" fill="#8BD8AB">EVAL COVERAGE</text><text x="64" y="346" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Logarithmic vertical scale</text><text x="866" y="346" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0" fill="#B0C2B6">Fraction of targets inside the candidate set</text><path d="M133 786.0 L729 786.0" stroke="#355046" stroke-width="2" fill="none"/><text x="112" y="793.0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="end" letter-spacing="0" fill="#B0C2B6">1</text><path d="M133 697.8449007861318 L729 697.8449007861318" stroke="#355046" stroke-width="2" fill="none"/><text x="112" y="704.8449007861318" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="end" letter-spacing="0" fill="#B0C2B6">4</text><path d="M133 639.5775496069341 L729 639.5775496069341" stroke="#355046" stroke-width="2" fill="none"/><text x="112" y="646.5775496069341" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="end" letter-spacing="0" fill="#B0C2B6">10</text><path d="M133 569.716286356267 L729 569.716286356267" stroke="#355046" stroke-width="2" fill="none"/><text x="112" y="576.716286356267" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="end" letter-spacing="0" fill="#B0C2B6">30</text><path d="M133 493.1550992138682 L729 493.1550992138682" stroke="#355046" stroke-width="2" fill="none"/><text x="112" y="500.1550992138682" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="end" letter-spacing="0" fill="#B0C2B6">100</text><path d="M133 405.0 L729 405.0" stroke="#355046" stroke-width="2" fill="none"/><text x="112" y="412.0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="end" letter-spacing="0" fill="#B0C2B6">400</text